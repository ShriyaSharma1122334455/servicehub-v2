# nginx load balancer for the k6 load test.
# Spreads requests across every running `api` container and, if one is down
# or failing, retries the request on another one.

worker_processes auto;

events {
  worker_connections 4096;
}

http {
  # Logging every request would cost CPU under load and skew the results.
  access_log off;

  # Docker's internal DNS. `api` resolves to every running replica; re-checked
  # every 5s so scaling up or stopping a container is picked up without a reload.
  resolver 127.0.0.11 valid=5s ipv6=off;

  upstream api {
    zone api 64k;                                   # shared memory, needed for `resolve`
    server api:3000 resolve max_fails=1 fail_timeout=5s;
    keepalive 64;                                   # reuse connections to the backends
  }

  server {
    listen 80;

    location / {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      proxy_connect_timeout 2s;
      proxy_read_timeout 10s;

      # Failover: if an instance refuses the connection, times out or returns
      # 502/503/504, send the same request to the next instance instead of
      # returning an error. nginx only retries requests that are safe to
      # repeat (GET/HEAD), never a POST that may already have run.
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 3;
    }

    location = /lb-health {
      return 200 "ok\n";
    }
  }
}
